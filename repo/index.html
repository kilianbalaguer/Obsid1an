<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsid1an Repo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #7e83ff 0%, #842a8b 70%, #3d1345 100%);
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .icon {
    width: 96px;
    height: 96px;
    margin-bottom: 20px;
  }

  .icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.35));
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    margin-bottom: 36px;
  }

  .url-bar {
    width: 100%;
    max-width: 380px;
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 5px;
    margin-bottom: 14px;
  }

  .url-bar span {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 14px;
    color: rgba(255,255,255,0.85);
    user-select: all;
    -webkit-user-select: all;
    letter-spacing: -0.01em;
  }

  .url-bar button {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 22px;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .url-bar button:hover {
    background: rgba(255,255,255,0.22);
  }

  .url-bar button:active {
    background: rgba(255,255,255,0.28);
  }

  .actions {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 48px;
  }

  .actions a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border-radius: 28px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.1s;
    letter-spacing: -0.01em;
  }

  .actions a:active {
    transform: scale(0.97);
  }

  .actions a svg {
    width: 18px;
    height: 18px;
  }

  .btn-primary {
    background: rgba(255,255,255,0.92);
    color: #1a1a2e;
  }

  .btn-primary:hover {
    background: #fff;
  }

  .btn-secondary {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.16);
  }

  .footer {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    line-height: 1.7;
  }

  .footer a {
    color: rgba(255,255,255,0.55);
    text-decoration: none;
  }

  .footer a:hover {
    color: rgba(255,255,255,0.8);
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 22px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="page">
  <div class="icon">
    <img src="icon.png" alt="Obsid1an">
  </div>

  <h1>Obsid1an</h1>
  <p class="tagline">Package Repository</p>

  <div class="url-bar">
    <span>https://repo.obsid1an.app/</span>
    <button onclick="copyRepo()">Copy</button>
  </div>

  <div class="actions">
    <a class="btn-primary" href="sileo://source/https://repo.obsid1an.app/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add to Sileo
    </a>
    <a class="btn-secondary" href="zbra://sources/add/https://repo.obsid1an.app/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add to Zebra
    </a>
  </div>

  <div class="footer">
    <a href="packages.html">Browse Packages</a><br>
    <a href="https://obsid1an.app">obsid1an.app</a> · <a href="https://github.com/kilianbalaguer" target="_blank" rel="noopener">Kilian Balaguer</a>
  </div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
function copyRepo() {
  var url = 'https://repo.obsid1an.app/';
  try {
    navigator.clipboard.writeText(url).then(show).catch(fallback);
  } catch(e) { fallback(); }

  function fallback() {
    var t = document.createElement('textarea');
    t.value = url;
    t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    show();
  }

  function show() {
    var el = document.getElementById('toast');
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 1500);
  }
}
</script>

</body>
</html>
