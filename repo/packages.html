<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsid1an — Packages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #7e83ff 0%, #842a8b 70%, #3d1345 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 24px 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .header img {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .header .back {
    margin-left: auto;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
  }

  .header .back:hover {
    color: #fff;
  }

  .search {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 24px 16px;
  }

  .search input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .search input::placeholder {
    color: rgba(255,255,255,0.35);
  }

  .search input:focus {
    border-color: rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.14);
  }

  .packages {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .package {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    text-decoration: none;
    color: #fff;
    transition: background 0.15s;
  }

  .package:hover {
    background: rgba(255,255,255,0.13);
  }

  .package .pkg-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    flex-shrink: 0;
    overflow: hidden;
  }

  .package .pkg-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .package .pkg-info {
    flex: 1;
    min-width: 0;
  }

  .package .pkg-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .package .pkg-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .package .pkg-version {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.3);
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 64px 24px;
    color: rgba(255,255,255,0.35);
    font-size: 15px;
    line-height: 1.6;
  }

  .empty .big {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.3;
  }
</style>
</head>
<body>

<div class="header">
  <img src="icon.png" alt="Obsid1an">
  <h1>Packages</h1>
  <a class="back" href="/">Repo</a>
</div>

<div class="search">
  <input type="text" placeholder="Search packages…" id="search" autocomplete="off">
</div>

<div class="packages" id="packages">
  <div class="empty">
    <div class="big">◇</div>
    No packages yet.<br>Packages will appear here when added to the repository.
  </div>
</div>

<script>
// Package data — update this when you add .debs
// Each entry maps to a depiction page
var PACKAGES = [
  {
    id: 'com.obsid1an.shardfetch',
    name: 'ShardFetch',
    description: 'System info tool with rainbow Apple logo — neofetch for iOS',
    version: '1.0.0',
    icon: '',
    depiction: 'depictions/com.obsid1an.shardfetch.html'
  }
];

function render(filter) {
  var container = document.getElementById('packages');
  var filtered = PACKAGES;

  if (filter) {
    var q = filter.toLowerCase();
    filtered = PACKAGES.filter(function(p) {
      return p.name.toLowerCase().indexOf(q) !== -1 ||
             p.description.toLowerCase().indexOf(q) !== -1 ||
             p.id.toLowerCase().indexOf(q) !== -1;
    });
  }

  if (filtered.length === 0 && PACKAGES.length === 0) return;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">No packages match your search.</div>';
    return;
  }

  container.innerHTML = filtered.map(function(p) {
    var iconHtml = p.icon
      ? '<img src="' + p.icon + '" alt="">'
      : '';
    return '<a class="package" href="' + p.depiction + '">' +
      '<div class="pkg-icon">' + iconHtml + '</div>' +
      '<div class="pkg-info">' +
        '<div class="pkg-name">' + p.name + '</div>' +
        '<div class="pkg-desc">' + p.description + '</div>' +
      '</div>' +
      '<span class="pkg-version">' + p.version + '</span>' +
    '</a>';
  }).join('');
}

document.getElementById('search').addEventListener('input', function(e) {
  render(e.target.value);
});

render();
</script>

</body>
</html>
